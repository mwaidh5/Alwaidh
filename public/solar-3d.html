<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar scene prototype</title>
<style>
  html,body{margin:0;height:100%;background:#0b1220;overflow:hidden;font-family:Inter,system-ui,sans-serif}
  #wrap{position:relative;width:100%;height:100%}
  canvas{display:block}
  #hud{position:absolute;left:14px;bottom:14px;display:flex;gap:10px;align-items:center;pointer-events:none}
  #count{background:rgba(255,255,255,.1);color:#e2e8f0;border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700}
  #msg{color:rgba(255,255,255,.6);font-size:12px}
  #msg.done{color:#fcd34d;font-weight:700}
  #dbg{position:absolute;right:8px;top:8px;color:#475569;font-size:10px;white-space:pre;text-align:right;pointer-events:none;display:none}
  body.debug #dbg{display:block}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span id="count">0 / 6</span>
    <span id="msg">Drag the worker, or tap the roof</span>
  </div>
  <div id="dbg"></div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'https://cdn.jsdelivr.net/npm/meshoptimizer@0.20.0/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

if (new URLSearchParams(location.search).get('debug')) document.body.classList.add('debug');
const wrap = document.getElementById('wrap');
const dbg = document.getElementById('dbg');
const countEl = document.getElementById('count');
const msgEl = document.getElementById('msg');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);
// Metallic materials (the panel glass) reflect their surroundings; with no
// environment they render black. This gives them something to reflect.
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;
scene.fog = new THREE.Fog(0x0b1220, 34, 80);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);

// Light like a Baghdad afternoon: warm key from the sun side, cool fill.
scene.add(new THREE.HemisphereLight(0xdce8ff, 0x39435e, 1.7));
const sun = new THREE.DirectionalLight(0xffdF9e, 2.7);
sun.position.set(9, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
scene.add(sun);

// Ground: a soft dark disc that fades into the page background.
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(26, 48),
  new THREE.MeshStandardMaterial({ color: 0x121b2e, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
const load = url => new Promise((res, rej) => loader.load(url, res, undefined, rej));

const state = {
  slots: [], filled: 0, walking: false, dragging: false, busy: false,
  worker: null, workerHome: null, mixer: null, panelProto: null, roofY: 0,
  roofRect: null, houseTop: 0
};

function fit(obj, targetSize) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const s = targetSize / Math.max(size.x, size.y, size.z);
  obj.scale.setScalar(s);
  return s;
}

function groundAt(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  obj.position.y -= box.min.y;
  return box;
}

function shadows(obj) {
  obj.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
}

/** Find the flat part of the roof by raining rays on the house. */
function findRoof(house) {
  const box = new THREE.Box3().setFromObject(house);
  const ray = new THREE.Raycaster();
  const down = new THREE.Vector3(0, -1, 0);
  const hits = [];
  const N = 24;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const x = THREE.MathUtils.lerp(box.min.x, box.max.x, (i + .5) / N);
    const z = THREE.MathUtils.lerp(box.min.z, box.max.z, (j + .5) / N);
    ray.set(new THREE.Vector3(x, box.max.y + 2, z), down);
    const h = ray.intersectObject(house, true)[0];
    if (h) hits.push({ x, z, y: h.point.y });
  }
  // The roof is the most common height band in the top half of the house.
  const minY = box.min.y + (box.max.y - box.min.y) * 0.45;
  const top = hits.filter(h => h.y > minY);
  const bins = new Map();
  for (const h of top) {
    const k = Math.round(h.y / 0.12);
    bins.set(k, (bins.get(k) || []).concat(h));
  }
  let best = [];
  for (const arr of bins.values()) if (arr.length > best.length) best = arr;
  const xs = best.map(h => h.x), zs = best.map(h => h.z), ys = best.map(h => h.y);
  ys.sort((a, b) => a - b);
  return {
    y: ys[Math.floor(ys.length / 2)],
    minX: Math.min(...xs), maxX: Math.max(...xs),
    minZ: Math.min(...zs), maxZ: Math.max(...zs),
    samples: best.length, totalHits: hits.length, houseBox: box
  };
}

const files = ['/3d/house.glb', '/3d/panel.glb', '/3d/worker.glb'];
Promise.all(files.map(load)).then(([houseG, panelG, workerG]) => {
  const house = houseG.scene;
  fit(house, 10);
  const hbox = groundAt(house);
  house.position.x = -(hbox.min.x + hbox.max.x) / 2;
  house.position.z = -(hbox.min.z + hbox.max.z) / 2;
  shadows(house);
  scene.add(house);

  const roof = findRoof(house);
  state.roofY = roof.y;
  state.roofRect = roof;
  state.houseTop = roof.houseBox.max.y;

  // Everything is sized off the worker: he is 1.75 m tall, which fixes
  // how long a metre is in this scene, and a rack of six panels is about
  // 3.4 m across — panels are 2.2 m things, not roof ornaments. Four
  // racks of that size fill the roof, so the grid is 2 × 2.
  const houseH = roof.houseBox.max.y - roof.houseBox.min.y;
  const metre = (houseH * 0.33) / 1.75;
  const inX = (roof.maxX - roof.minX) * 0.14, inZ = (roof.maxZ - roof.minZ) * 0.14;
  const x0 = roof.minX + inX, x1 = roof.maxX - inX;
  const z0 = roof.minZ + inZ, z1 = roof.maxZ - inZ;
  const cellW = (x1 - x0) / 2, cellD = (z1 - z0) / 2;

  const panel = panelG.scene;
  shadows(panel);
  fit(panel, Math.min(3.4 * metre, cellW * 1.04));
  const pbox = new THREE.Box3().setFromObject(panel);
  const plift = -pbox.min.y;

  for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) {
    const p = panel.clone(true);
    p.position.set(x0 + (i + .5) * cellW, roof.y + plift, z0 + (j + .5) * cellD);
    p.rotation.y = Math.PI;
    p.visible = false;
    p.userData.pop = 0;
    scene.add(p);
    state.slots.push({ mesh: p, filled: false, x: p.position.x, z: p.position.z });
  }

  const worker = workerG.scene;
  shadows(worker);
  const wTarget = 1.75 * metre;
  const wbox0 = new THREE.Box3().setFromObject(worker);
  const wsize = wbox0.getSize(new THREE.Vector3());
  worker.scale.setScalar(wTarget / wsize.y);
  const wbox = new THREE.Box3().setFromObject(worker);
  worker.userData.footLift = -wbox.min.y;
  worker.position.set(roof.minX + inX * 0.5, roof.y + worker.userData.footLift, roof.minZ + inZ * 0.5);
  scene.add(worker);
  state.worker = worker;

  // The clip is "kicked in the groin" — freeze an early frame as a stance.
  if (workerG.animations.length) {
    state.mixer = new THREE.AnimationMixer(worker);
    const action = state.mixer.clipAction(workerG.animations[0]);
    action.play();
    state.mixer.update(0.25);
    state.clip = workerG.animations[0];
  }
  // The rig's spine — all three links of it. One bone bows the torso a
  // few degrees; bending the chain adds up to a real stoop over the rack.
  state.spines = [];
  worker.traverse(n => {
    if (n.isBone && /spine/i.test(n.name)) state.spines.push({ b: n, base: n.rotation.x });
  });
  state.spine = state.spines.length > 0;

  // Camera: three-quarter view, slightly above roof height.
  const c = roof.houseBox.getCenter(new THREE.Vector3());
  camera.position.set(c.x + 13.5, roof.y + 3.6, c.z + 13.5);
  camera.lookAt(c.x, roof.y * 0.5, c.z);

  dbg.textContent = JSON.stringify({
    roofY: +roof.y.toFixed(2), samples: roof.samples, hits: roof.totalHits,
    rect: [roof.minX, roof.maxX, roof.minZ, roof.maxZ].map(n => +n.toFixed(1)),
    workerH: +wTarget.toFixed(2),
    clip: state.clip ? +state.clip.duration.toFixed(2) + 's' : 'none'
  }, null, 1);

  // A job in progress: some racks are already done and never move.
  for (let k = 0; k < 2; k++) {
    const sl = state.slots[k];
    sl.filled = true;
    sl.mesh.visible = true;
    state.filled++;
  }
  countEl.textContent = state.filled + ' / ' + state.slots.length;

  const qs = new URLSearchParams(location.search);
  // ?freeze=1 holds the auto loop, so a screenshot shows a chosen moment
  // instead of wherever the loop happened to be.
  if (qs.get('freeze')) state.busy = true;
  const pre = Number(qs.get('fill') || 0);
  for (let k = 0; k < Math.min(pre, state.slots.length); k++) {
    const s = state.slots[k];
    s.filled = true; s.mesh.visible = true;
    state.filled++;
  }
  countEl.textContent = state.filled + ' / ' + state.slots.length;
  if (pre) {
    const s = state.slots[Math.min(pre, 5)];
    state.worker.position.set(s.x + 0.9, state.roofY + state.worker.userData.footLift, s.z + 0.5);
    state.worker.lookAt(s.x, state.worker.position.y, s.z);
  }

  if (qs.get('pose') === 'work') {
    const sl = state.slots[3];
    state.worker.position.set(sl.x + 0.9 * metre, state.roofY + state.worker.userData.footLift, sl.z + 0.7 * metre);
    state.worker.lookAt(sl.x, state.worker.position.y, sl.z);
    if (state.spine) for (const sp of state.spines) sp.b.rotation.x = sp.base + 0.55;
    else state.worker.rotation.x = 0.4;
    state.busy = true;
  }

  window.__scene = { state, roof, camera, renderer, scene, THREE };
  animate();
  setInterval(tick, 2600);
}).catch(e => { dbg.textContent = 'LOAD ERROR: ' + e.message; console.error(e); });

/* ---- behaviour: same rules as the SVG version ---- */
let walkFrom = null, walkTo = null, walkT = 0, targetSlot = -1;

function walkToSlot(k) {
  const s = state.slots[k];
  if (!s || s.filled || state.walking || state.dragging || state.busy || state.workT > 0) return;
  targetSlot = k;
  state.walking = true;
  walkFrom = state.worker.position.clone();
  const side = s.x > (state.roofRect.minX + state.roofRect.maxX) / 2 ? -1 : 1;
  walkTo = new THREE.Vector3(s.x + side * 0.9, state.roofY + state.worker.userData.footLift, s.z + 0.5);
  walkT = 0;
  state.worker.lookAt(walkTo.x, state.worker.position.y, walkTo.z);
}

function arrive() {
  state.walking = false;
  const s = state.slots[targetSlot];
  if (!s || s.filled) return;
  // Don't drop the panel in from nowhere: he bends over the rack and
  // fastens it — a slow bow with a small turning wiggle, like driving
  // screws — and the rack appears mid-work, not on arrival.
  state.worker.lookAt(s.x, state.worker.position.y, s.z);
  state.workT = 0.0001;
  state.workSlot = targetSlot;
}

function workDone() {
  const s = state.slots[state.workSlot];
  if (s && !s.filled) {
    s.filled = true;
    s.mesh.visible = true;
    s.mesh.userData.pop = 0.001;
    state.filled++;
    countEl.textContent = state.filled + ' / ' + state.slots.length;
  }
}

function tick() {
  if (state.dragging || state.walking || state.busy || state.workT > 0 || !state.worker) return;
  const k = state.slots.findIndex(sl => !sl.filled);
  if (k >= 0) { walkToSlot(k); return; }
  state.busy = true;
  msgEl.textContent = 'Roof done — your house next?';
  msgEl.className = 'done';
  setTimeout(() => {
    state.slots.forEach((s, k) => {
      if (k < 2) return; // the finished racks stay — the job was real
      s.filled = false;
      s.mesh.visible = false;
    });
    state.filled = 2;
    countEl.textContent = state.filled + ' / ' + state.slots.length;
    msgEl.textContent = 'Drag the worker, or tap the roof';
    msgEl.className = '';
    state.busy = false;
  }, 3400);
}

/* pointer: drag the worker, tap the roof */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function cast(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
function roofPoint() {
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -state.roofY);
  const p = new THREE.Vector3();
  return ray.ray.intersectPlane(plane, p) ? p : null;
}
addEventListener('pointerdown', e => {
  if (!state.worker || state.busy) return;
  cast(e);
  const hitWorker = ray.intersectObject(state.worker, true).length > 0;
  if (hitWorker) {
    state.dragging = true;
    state.walking = false;
    state.workT = 0;
    state.workPlaced = false;
    if (state.spine) for (const sp of state.spines) sp.b.rotation.x = sp.base;
    else state.worker.rotation.x = 0;
    return;
  }
  const p = roofPoint();
  if (!p) return;
  const r = state.roofRect;
  if (p.x < r.minX || p.x > r.maxX || p.z < r.minZ || p.z > r.maxZ) return;
  let best = -1, bd = 1e9;
  state.slots.forEach((s, k) => {
    if (s.filled) return;
    const d = (s.x - p.x) ** 2 + (s.z - p.z) ** 2;
    if (d < bd) { bd = d; best = k; }
  });
  if (best >= 0) { state.walking = false; walkToSlot(best); }
});
addEventListener('pointermove', e => {
  if (!state.dragging) return;
  cast(e);
  const p = roofPoint();
  if (!p) return;
  const r = state.roofRect;
  state.worker.position.x = THREE.MathUtils.clamp(p.x, r.minX, r.maxX);
  state.worker.position.z = THREE.MathUtils.clamp(p.z, r.minZ, r.maxZ);
});
addEventListener('pointerup', () => {
  if (!state.dragging) return;
  state.dragging = false;
  let best = -1, bd = 1e9;
  state.slots.forEach((s, k) => {
    if (s.filled) return;
    const d = (s.x - state.worker.position.x) ** 2 + (s.z - state.worker.position.z) ** 2;
    if (d < bd) { bd = d; best = k; }
  });
  if (best >= 0) walkToSlot(best);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (state.workT > 0) {
    // 0→1 over ~2.2s: bow in, hold with a fastening wiggle, bow out.
    state.workT = Math.min(1, state.workT + dt / 2.2);
    const t = state.workT;
    const bowIn = Math.min(1, t / 0.3);
    const bowOut = t > 0.78 ? (1 - t) / 0.22 : 1;
    const depth = Math.min(bowIn, bowOut);
    const wiggle = t > 0.3 && t < 0.78 ? Math.sin(t * 55) * 0.05 : 0;
    const bend = depth * 0.55 + wiggle;
    if (state.spine) for (const sp of state.spines) sp.b.rotation.x = sp.base + bend;
    else state.worker.rotation.x = bend * 0.6;
    if (t >= 0.55 && !state.workPlaced) { state.workPlaced = true; workDone(); }
    if (t >= 1) {
      state.workT = 0;
      state.workPlaced = false;
      if (state.spine) for (const sp of state.spines) sp.b.rotation.x = sp.base;
      else state.worker.rotation.x = 0;
    }
  }
  if (state.walking && walkTo) {
    walkT = Math.min(1, walkT + dt / 0.9);
    const e = walkT < .5 ? 2 * walkT * walkT : 1 - (-2 * walkT + 2) ** 2 / 2;
    state.worker.position.lerpVectors(walkFrom, walkTo, e);
    state.worker.position.y = state.roofY + state.worker.userData.footLift + Math.abs(Math.sin(walkT * Math.PI * 6)) * 0.07;
    if (walkT >= 1) arrive();
  }
  for (const s of state.slots) {
    if (s.mesh.userData.pop > 0 && s.mesh.userData.pop < 1) {
      s.mesh.userData.pop = Math.min(1, s.mesh.userData.pop + dt / 0.35);
      const k = s.mesh.userData.pop;
      const over = 1 + Math.sin(k * Math.PI) * 0.18;
      s.mesh.scale.setScalar(s.mesh.userData.baseScale ?? (s.mesh.userData.baseScale = s.mesh.scale.x));
      s.mesh.scale.multiplyScalar(k * over);
    }
  }
  renderer.render(scene, camera);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
