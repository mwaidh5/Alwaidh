<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v=3 busts the year-long immutable cache that kept the old letter-A
         icon alive. The .ico matters as much as the rest: browsers ask for
         /favicon.ico on their own, and the SPA catch-all was answering that
         request with HTML, so they kept whatever icon they had. -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Alwaidh" />
    <!-- No maximum-scale: it stopped the browser shrinking a too-wide page
         to fit and left no way to pinch out of it. Form text is 16px on
         touch screens (see index.css), which is what actually stops iOS
         zooming in when a field is tapped. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="google-site-verification" content="KW_wvAofKGDWRLR3O-tftRvPduiVQb1oPd7wo5FTdCQ" />
    <meta name="description" content="منظومات الطاقة الشمسية في العراق — أسعار، تركيب وصيانة من شركة الواعظ في بغداد. Solar energy systems, computers and Tiandy security cameras in Iraq — supplied, installed and serviced by Alwaidh, Baghdad." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <title>الواعظ للقدرة — منظومات الطاقة الشمسية في العراق | Alwaidh Solar, Computers &amp; Cameras</title>
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"LocalBusiness","name":"Al-Waidh Technology Trading Co. — شركة الواعظ","alternateName":"Alwaidh — الواعظ للقدرة","url":"https://alwaidh.com","logo":"https://alwaidh.com/pwa-512.png","telephone":"+964 774 420 5582","email":"support@alwaidh.com","address":{"@type":"PostalAddress","streetAddress":"Sinaa Street — شارع الصناعة","addressLocality":"Baghdad","addressCountry":"IQ"},"openingHours":"Sa-Th 08:30-15:30","description":"منظومات الطاقة الشمسية والحاسبات وكاميرات المراقبة في العراق — تجهيز وتركيب وصيانة منذ 1992."}
    </script>
  </head>
  <body class="bg-white text-slate-900 antialiased">
    <div id="root"></div>
    <!-- Shown the instant the page arrives, gone when the app has drawn:
         on slow internet the alternative is a bare white screen. -->
    <div id="boot">
      <img src="/pwa-192.png" alt="Alwaidh" width="76" height="76" />
      <div class="boot-spin" aria-hidden="true"></div>
    </div>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #ffffff;
        transition: opacity 0.35s ease;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot img {
        border-radius: 20px;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-spin {
        width: 27px;
        height: 27px;
        border-radius: 50%;
        border: 3px solid #dbeafe;
        border-top-color: #2563eb;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
